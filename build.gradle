plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
    id 'maven-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://maven.nucleoid.xyz/' }
    maven { url "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Mod dependencies
    include implementation("me.lucko:fabric-permissions-api:${project.permission_version}")
    include implementation("eu.pb4:sgui:${project.sgui_version}")
    include implementation("eu.pb4:common-protection-api:${project.common_protection_api_version}")
    include implementation("eu.pb4:placeholder-api:${project.placeholder_api_version}")
    include implementation("xyz.nucleoid:server-translations-api:${project.server_translations_api_version}")
}

publishMods {
    file = jar.archiveFile
    type = STABLE
    changelog = providers.environmentVariable("CHANGELOG").getOrElse("No changelog provided")

    displayName = "ItsOurs ${version.get()}"

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("DrexHD/ItsOurs")
        commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("main")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}


jar {
    from "LICENSE"
}
